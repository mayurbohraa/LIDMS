[project]
name = "lidms"
version = "1.0.0"
description = "Lab Information Digitalization and Management Systems"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django==5.2.18",
  "dj-database-url==3.1.2",
  "psycopg[binary]==3.3.6",
  "whitenoise==6.12.0",
  "python-dotenv==1.2.4",
]

[tool.vercel]
entrypoint = "lidms.wsgi:application"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["inventory/migrations", "test-results", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
