{% extends 'base.html' %}
{% block content %}<div class="page-heading"><div><h1>My profile</h1><p>Your workspace identity and contact details.</p></div><a href="{% url 'password_change' %}" class="button secondary">Change password</a></div><section class="panel form-panel"><div class="profile-summary"><span class="avatar large" aria-hidden="true">{{ account_initials }}</span><div><h2>{{ account_name }}</h2><p>{{ user.email }}</p><span class="badge">{{ account_role }}</span></div></div><form method="post">{% csrf_token %}{% include 'partials/fields.html' %}<div class="form-actions"><button class="button" type="submit">Save profile</button></div></form></section>{% endblock %}
